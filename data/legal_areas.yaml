      - id: product_q4
        text: "Wordt het product aangeprezen als bescherming tegen een risico (zoals verkeer, brand of valpartijen) of is het bedoeld voor kwetsbare groepen (kinderen, ouderen)?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32016R0425"]
    common_mistakes:
      - text: "Denken dat een AVG-achtige 'algemene voorwaarden'-uitsluiting de aansprakelijkheid van de producent wegneemt. Volgens de gelezen secundaire bronnen kan productaansprakelijkheid in beginsel niet worden uitgesloten (6:192 BW); controleer op wettekst."
