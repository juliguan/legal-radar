  # ---------------------------------------------------------------------------------------------
  - id: voedsel_gezondheidsclaims
    name: "Voedsel- en gezondheidsclaims"
    summary_nl: >-
      Producten die als levensmiddel, drank of voedingssupplement op de markt komen vallen onder voedselwetgeving.
      Voedings- en gezondheidsclaims mogen alleen als ze zijn toegestaan, en medische claims (ziekte voorkomen,
      behandelen of genezen) zijn verboden en kunnen een product tot geneesmiddel maken.
    applies_to:
      - text: "Voedingssupplementen, sportvoeding, dranken, shots en andere levensmiddelen"
        source_url: "https://ondernemersplein.overheid.nl/wetten-en-regels/voedingssupplementen-maken-of-verkopen/"
      - text: "Elke uiting (verpakking, website, social media) die een voordeel voor gezondheid, prestatie of ziekte suggereert"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32006R1924"
      - text: "Nieuwe ingrediënten die vóór 15 mei 1997 niet in de EU in significante mate werden gegeten (novel food)"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32015R2283"
    laws:
      - id: claims_reg
        reference: "Verordening (EG) 1924/2006 (voedings- en gezondheidsclaims): art. 2 (definities), 3 (algemene beginselen), 5 (algemene voorwaarden), 6 (wetenschappelijke onderbouwing), 10 (specifieke voorwaarden gezondheidsclaims), 13 (gezondheidsclaims niet over ziekterisico), 14 (ziekterisicobeperking en kinderen)"
        article: "2, 3, 5, 6, 10, 13, 14"
        what_nl: "Claims moeten toegestaan en wetenschappelijk onderbouwd zijn; alleen claims uit de lijst (Unieregister) mogen gebruikt worden."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32006R1924"
        evidence: text_checked
        verified: false
      - id: claims_list
        reference: "Verordening (EU) 432/2012 (lijst toegestane gezondheidsclaims) en Unieregister"
        article: "TODO verify"
        what_nl: "Gezondheidsclaims over bestanddelen en hun toegestane formuleringen staan in deze lijst en het EU-register; botanicals-claims liggen al jaren on hold (secundaire bron)."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32012R0432"
        evidence: search_snippet
        verified: false
      - id: fic_7
        reference: "Verordening (EU) 1169/2011 (voedselinformatie) art. 7 (eerlijke informatiepraktijken; lid 3: verbod op medische claims), art. 9 (verplichte vermeldingen), art. 36 (voorschriften vrijwillige informatie)"
        article: "7, 9, 36"
        what_nl: "Voedselinformatie mag niet misleiden en mag geen eigenschap van ziektepreventie, -behandeling of -genezing toeschrijven (lid 3 zoals aangehaald door de NVWA; lidnummer niet zelf nagelezen)."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32011R1169"
        evidence: text_checked
        verified: false
      - id: gfl
        reference: "Verordening (EG) 178/2002 (algemene levensmiddelenwetgeving) art. 14 (voedselveiligheid), 17 (verantwoordelijkheden), 18 (traceerbaarheid), 19 (terugroepen)"
        article: "14, 17, 18, 19"
        what_nl: "Onveilige levensmiddelen mogen niet in de handel; exploitanten zijn verantwoordelijk en moeten traceerbaarheid en terugroepacties regelen."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32002R0178"
        evidence: text_checked
        verified: false
      - id: novel
        reference: "Verordening (EU) 2015/2283 (nieuwe voedingsmiddelen) art. 6 (Unielijst), art. 7 (voorwaarden opname)"
        article: "6, 7"
        what_nl: "Een nieuw voedingsmiddel mag alleen op de markt als het op de Unielijst staat."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32015R2283"
        evidence: text_checked
        verified: false
      - id: supplements
        reference: "Warenwetbesluit voedingssupplementen, Warenwetregeling voedingssupplementen, Warenwetbesluit kruidenpreparaten (implementatie Richtlijn 2002/46/EG)"
        article: "TODO verify"
        what_nl: "Regels over toegelaten vitaminen en mineralen, etiket (o.a. het woord 'voedingssupplement', gebruiksaanwijzing, waarschuwing buiten bereik van kinderen), en kruiden."
        source_url: "https://ondernemersplein.overheid.nl/wetten-en-regels/voedingssupplementen-maken-of-verkopen/"
        evidence: primary_page
        verified: false
      - id: gnw
        reference: "Geneesmiddelenwet art. 40 lid 2 (geen handel in geneesmiddel zonder handelsvergunning), art. 84 (reclame) en art. 1b (definitie geneesmiddel), zoals genoemd door de NVWA"
        article: "40 lid 2, 84, 1b (alleen via NVWA-pagina; wettekst niet gelezen: TODO verify)"
        what_nl: "Een levensmiddel met een medische claim kan als geneesmiddel worden beschouwd, ook op basis van presentatie."
        source_url: "https://www.nvwa.nl/onderwerpen/voedselveiligheid/voedingsclaims-en-gezondheidsclaims/verbod-op-medische-claims"
        evidence: primary_page
        verified: false
    trigger_questions:
      - id: voedsel_q1
        text: "Wordt iets gegeten, gedronken of ingenomen als product (levensmiddel, drank, shot, supplement)?"
        based_on: ["https://ondernemersplein.overheid.nl/wetten-en-regels/voedingssupplementen-maken-of-verkopen/"]
      - id: voedsel_q2
        text: "Wordt beweerd of gesuggereerd dat het product de gezondheid, prestaties of lichaamsfuncties beïnvloedt (zoals energie, herstel, spieren, slaap, immuunsysteem)?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32006R1924"]
      - id: voedsel_q3
        text: "Wordt een ziekte of aandoening genoemd, of beweerd dat iets die voorkomt, behandelt of verlicht (zoals kramp, pijn, diabetes)?"
        based_on: ["https://www.nvwa.nl/onderwerpen/voedselveiligheid/voedingsclaims-en-gezondheidsclaims/verbod-op-medische-claims"]
      - id: voedsel_q4
        text: "Bevat het product een nieuw of ongebruikelijk ingrediënt, plantenextract of hoge dosering van een stof?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32015R2283", "https://ondernemersplein.overheid.nl/wetten-en-regels/voedingssupplementen-maken-of-verkopen/"]
    common_mistakes:
      - text: "Een medische claim gebruiken (bijv. 'helpt bij kramp') waar alleen een toegelaten gezondheidsclaim mag; de NVWA noemt ook dat productnamen geen toespelingen op medische werking mogen maken."
        source_url: "https://www.nvwa.nl/onderwerpen/voedselveiligheid/voedingsclaims-en-gezondheidsclaims/verbod-op-medische-claims"
        evidence: primary_page
        verified: false
      - text: "Verwijzen naar studies of websites met medische informatie over het product; de NVWA stelt dat dat niet mag."
        source_url: "https://www.nvwa.nl/onderwerpen/voedselveiligheid/voedingsclaims-en-gezondheidsclaims/verbod-op-medische-claims"
