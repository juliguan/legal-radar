        reference: "PBM-verordening (EU) 2016/425 (persoonlijke beschermingsmiddelen, CE-markering)"
        article: "TODO verify"
        what_nl: "Alleen via zoekresultaten gezien; of een product een PBM is hangt af van de bedoeling (bescherming tegen risico's), niet van decoratie. Wettekst niet gelezen."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32016R0425"
        evidence: search_snippet
        verified: false
      - id: warenwet
        reference: "Warenwet (nationale basis voor productveiligheid in de non-foodsector)"
        article: "TODO verify"
        what_nl: "Wet gedownload maar relevante artikelen niet geïdentificeerd."
        source_url: "https://wetten.overheid.nl/BWBR0001969/"
        evidence: text_checked
        verified: false
      - id: cra
        reference: "Cyber Resilience Act (producten met digitale elementen)"
        article: "TODO verify"
        what_nl: "Secundaire bronnen: meldplichten voor actief uitgebuite kwetsbaarheden vanaf 11 september 2026; hoofdverplichtingen vanaf 11 december 2027. Wettekst niet gelezen."
        source_url: "https://digital-strategy.ec.europa.eu/en/policies/cra-reporting"
        evidence: search_snippet
        verified: false
    trigger_questions:
      - id: product_q1
        text: "Gaat het om een fysiek product (of product met ingebouwde software) dat voor consumenten bedoeld is en op de EU-markt komt?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R0988"]
      - id: product_q2
        text: "Kan het product of de software bij normaal gebruik letsel of schade veroorzaken (lichamelijk, aan eigendom of aan gegevens)?"
        based_on: ["https://wetten.overheid.nl/BWBR0005289/", "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32024L2853"]
      - id: product_q3
        text: "Wordt het product geïmporteerd van buiten de EU, door een derde geproduceerd of via een onlinemarktplaats verkocht?"
