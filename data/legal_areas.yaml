  # ---------------------------------------------------------------------------------------------
  - id: productaansprakelijkheid
    name: "Productaansprakelijkheid en productveiligheid"
    summary_nl: >-
      Wie fysieke consumentenproducten maakt, importeert of verkoopt moet ze veilig op de markt brengen en kan
      aansprakelijk zijn voor schade door gebreken. Vanaf 9 december 2026 geldt dat nadrukkelijk ook voor software.
    applies_to:
      - text: "Fysieke consumentenproducten (fabrikant, gemachtigde, importeur, distributeur, fulfilmentdienst, marktplaats)"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R0988"
      - text: "Producten waarvoor aparte EU-productwetgeving geldt (bijv. persoonlijke beschermingsmiddelen): de GPSR vult aan voor niet-gedekte aspecten"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R0988"
      - text: "Software en digitale producten die schade kunnen veroorzaken (nieuwe richtlijn, voor producten na 9 december 2026)"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32024L2853"
    laws:
      - id: gpsr_scope
        reference: "GPSR (Verordening (EU) 2023/988) art. 2 (toepassingsgebied), art. 3 (definities), art. 5 (algemeen veiligheidsvereiste), art. 6 (beoordeling productveiligheid)"
        article: "2, 3, 5, 6"
        what_nl: "Producten in de handel moeten veilig zijn. Verordening geldt voor zover het Unierecht geen specifieke bepalingen met hetzelfde doel bevat."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R0988"
        evidence: text_checked
        verified: false
      - id: gpsr_operators
        reference: "GPSR art. 9 (fabrikanten), 10 (gemachtigden), 11 (importeurs), 12 (distributeurs), 13 (wanneer verplichtingen van fabrikanten ook voor anderen gelden), 14 (interne procedures)"
        article: "9, 10, 11, 12, 13, 14"
        what_nl: "Rolgebonden verplichtingen: risicoanalyse, technische documentatie, traceerbaarheid, contactgegevens."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R0988"
        evidence: text_checked
        verified: false
      - id: gpsr_online
        reference: "GPSR art. 19 (verkoop op afstand), art. 22 (onlinemarktplaatsen), art. 35 (informatie aan consumenten)"
        article: "19, 22, 35"
        what_nl: "Aanbod op afstand moet o.a. identificatie- en veiligheidsinformatie tonen."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R0988"
        evidence: text_checked
        verified: false
      - id: gpsr_accidents
        reference: "GPSR art. 20 (ongevallen), art. 25 en 26 (Safety Gate en kennisgeving gevaarlijke producten)"
        article: "20, 25, 26"
        what_nl: "Ongevallen en gevaarlijke producten melden via het Safety Business Gateway; NVWA is toezichthouder."
        source_url: "https://www.nvwa.nl/onderwerpen/melden-onveilige-producten-non-food/melden-als-ondernemer"
        evidence: primary_page
        verified: false
      - id: gpsr_date
        reference: "GPSR art. 52 (inwerkingtreding en toepassing; intrekking Richtlijn 2001/95/EG per 13 december 2024)"
        article: "52"
        what_nl: "GPSR van toepassing sinds 13 december 2024."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R0988"
        evidence: text_checked
        verified: false
      - id: bw6_185
        reference: "BW Boek 6 art. 185 e.v. (productaansprakelijkheid; lid 1: producent aansprakelijk voor schade door een gebrek in zijn product)"
        article: "6:185"
        what_nl: "Risicoaansprakelijkheid van de producent voor gebrekkige producten. Uitsluiting of beperking van deze aansprakelijkheid is in beginsel niet mogelijk (6:192): TODO verify op wettekst."
        source_url: "https://wetten.overheid.nl/BWBR0005289/"
        evidence: text_checked
        verified: false
      - id: pld_2024
        reference: "Richtlijn (EU) 2024/2853 (productaansprakelijkheid) art. 4 (definities, incl. software), art. 5 (recht op schadevergoeding), art. 7 (gebrekkigheid), art. 8 (aansprakelijke marktdeelnemers), art. 9 (bewijs), art. 10 (bewijslast), art. 21 (intrekking 85/374/EEG en overgangsbepaling)"
        article: "4, 5, 7, 8, 9, 10, 21"
        what_nl: "Software, digitale fabricagedossiers en gerelateerde diensten vallen onder het regime. Van toepassing op producten die na 9 december 2026 in de handel zijn gebracht."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32024L2853"
        evidence: text_checked
        verified: false
