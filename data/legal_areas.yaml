  # ---------------------------------------------------------------------------------------------
  - id: financieel
    name: "Financiële regelgeving (Wft, MiCA, witwassen)"
    summary_nl: >-
      Wie financiële producten adviseert of bemiddelt, krediet geeft, cryptodiensten aanbiedt of met geld van
      anderen werkt, kan onder vergunningplicht van de AFM en/of de Wwft en MiCA vallen. Alleen informeren is
      vaak iets anders dan adviseren of bemiddelen.
    applies_to:
      - text: "Platforms die cryptoactiva bewaren, omwisselen, verhandelen of ervoor bemiddelen of adviseren (cryptoactivadiensten)"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R1114"
      - text: "Diensten die financiële producten (krediet, verzekeringen, beleggingen) adviseren of bemiddelen"
        source_url: "https://wetten.overheid.nl/BWBR0020368/"
      - text: "Diensten die onder de Wwft vallen en dus cliëntenonderzoek en meldplicht kennen (o.a. aanbieders van cryptoactivadiensten)"
        source_url: "https://wetten.overheid.nl/BWBR0024282/"
    laws:
      - id: mica_scope
        reference: "MiCA (Verordening (EU) 2023/1114) art. 2 (toepassingsgebied), art. 3 lid 1 punten 15 en 16 (aanbieder van cryptoactivadiensten; cryptoactivadienst), art. 59 (vergunningverlening), art. 60"
        article: "2, 3(1)(15)(16), 59, 60"
        what_nl: "Cryptoactivadiensten zijn o.a. bewaren en beheren namens cliënten, handelsplatform, omwisselen voor geld of andere cryptoactiva, uitvoeren van orders, plaatsen; vergunning of kennisgeving vereist (art. 59/60). Volgens recital 22 vallen volledig gedecentraliseerde diensten zonder tussenpersoon buiten de verordening; de afbakening is volgens ESMA per geval te beoordelen (secundaire bron)."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R1114"
        evidence: text_checked
        verified: false
      - id: mica_transition
        reference: "MiCA art. 143 lid 3 (overgangsregeling tot 1 juli 2026; lidstaten mogen verkorten)"
        article: "143(3)"
        what_nl: "Bestaande aanbieders mochten maximaal tot 1 juli 2026 doorgaan; Nederland verkortte de overgang volgens secundaire bron tot 30 juni 2025."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R1114"
        evidence: text_checked
        verified: false
      - id: wft_licence
        reference: "Wft art. 2:60 (krediet aanbieden), art. 2:75 (adviseren over andere financiële producten dan ...), art. 2:80 (bemiddelen), art. 2:92 (gevolmachtigd agent)"
        article: "2:60, 2:75, 2:80, 2:92"
        what_nl: "Het is verboden zonder AFM-vergunning krediet aan te bieden, te adviseren (over bepaalde producten), te bemiddelen of op te treden als gevolmachtigd agent. De volledige reikwijdte van art. 2:75 niet doorgelezen: TODO verify."
        source_url: "https://wetten.overheid.nl/BWBR0020368/"
        evidence: text_checked
        verified: false
      - id: wwft
        reference: "Wwft art. 1a (begrippen; o.a. aanbieder van cryptoactivadiensten), art. 3 (cliëntenonderzoek), art. 16 (melding ongebruikelijke transacties aan de FIU)"
        article: "1a, 3, 16"
        what_nl: "Instellingen verrichten cliëntenonderzoek en melden ongebruikelijke transacties. Aanbieders van cryptoactivadiensten staan in de definitie van instelling (lijst in art. 1a)."
        source_url: "https://wetten.overheid.nl/BWBR0024282/"
        evidence: text_checked
        verified: false
      - id: tfr
        reference: "Verordening (EU) 2023/1113 (Transfer of Funds Regulation) art. 14 (informatie bij overdrachten van cryptoactiva), art. 16, 19, 21; van toepassing vanaf 30 december 2024"
        article: "14, 16, 19, 21"
        what_nl: "Bij overdrachten van cryptoactiva tussen aanbieders moet informatie over initiator en begunstigde worden meegestuurd."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R1113"
        evidence: text_checked
        verified: false
      - id: amlr
        reference: "AML-verordening (EU) 2024/1624 art. 3 (meldingsplichtige entiteiten); van toepassing vanaf 10 juli 2027 (met uitzonderingen)"
        article: "3"
        what_nl: "Vervangt in de loop van 2027 grote delen van de Wwft-systematiek."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32024R1624"
        evidence: text_checked
        verified: false
      - id: sanctiewet
        reference: "Sanctiewet 1977"
        article: "TODO verify"
        what_nl: "Genoemd in zoekresultaten bij DNB-registratie; wettekst niet gelezen (opgehaalde pagina was leeg)."
        source_url: "https://wetten.overheid.nl/BWBR0001679/"
        evidence: search_snippet
        verified: false
    trigger_questions:
      - id: financieel_q1
        text: "Gaat het om cryptoactiva (bitcoin, tokens, stablecoins) en bewaart, omwisselt, verhandelt, adviseert of bemiddelt het idee daarbij voor anderen?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R1114"]
      - id: financieel_q2
        text: "Worden financiële producten (krediet, verzekering, belegging, pensioen) geadviseerd, bemiddeld of aangeboden?"
        based_on: ["https://wetten.overheid.nl/BWBR0020368/"]
      - id: financieel_q3
        text: "Wordt er geld of crypto van klanten ontvangen, bewaard of doorgestuurd, of vraagt het idee een voorschot of succesfee voor het terughalen of beheren van geld of crypto?"
        based_on: ["https://wetten.overheid.nl/BWBR0024282/", "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32023R1113"]
      - id: financieel_q4
        text: "Vergelijkt of selecteert het idee financiële producten voor consumenten en krijgt het een vergoeding of provisie van aanbieders?"
        based_on: ["https://wetten.overheid.nl/BWBR0020368/"]
    common_mistakes:
      - text: "Denken dat 'we geven alleen informatie' altijd buiten de vergunningplicht valt. De AFM maakt onderscheid tussen informeren en adviseren/bemiddelen; wie meer doet dan contactgegevens doorgeven, kan bemiddelen."
        source_url: "https://www.afm.nl/~/profmedia/files/nieuws/2021/interpretatie-informeren-en-adviseren.pdf?la=nl-nl"
        evidence: search_snippet
        verified: false
      - text: "Een cryptodienst starten zonder vergunning of zonder rekening te houden met de overgangstermijnen die voor bestaande aanbieders eindigden."
        source_url: "https://www.regulationtomorrow.com/2025/06/afm-update-on-micar-and-transition-period/"
        evidence: secondary
        verified: false
      - text: "Het idee dat een 'terughaaldienst' voor verloren crypto met voorschot onschuldig is: de AFM waarschuwt voor recovery fraud na een eerste verlies."
        source_url: "https://www.afm.nl/nl-nl/consumenten/themas/crypto/risicos-van-crypto"
        evidence: search_snippet
        verified: false
    recent_changes:
