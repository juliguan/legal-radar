# Legal Radar - rechtsgebieden, triggervragen en bronnen
#
# STATUS: ONGECONTROLEERD CONCEPT. Alles staat op "verified: false" tot een jurist het heeft nagelopen.
# Raadpleegdatum van alle bronnen: 2026-10-05.
#
# Leeswijzer
#   article:   alleen ingevuld als het artikelnummer en de titel zijn teruggevonden in de wettekst die
#              ik heb gedownload (EUR-Lex of wetten.overheid.nl). Anders staat er "TODO verify".
#   evidence:  text_checked    = artikel(en) teruggevonden in de volledige wettekst
#              primary_page    = gelezen op een pagina van een toezichthouder / overheid
#              search_snippet  = alleen gezien in een zoekresultaat (samenvatting), pagina zelf niet gelezen
#              secondary       = kantoorsite, blog of branchevereniging
#   Het model ziet alleen id, naam en triggervragen. Alle andere tekst is voor het rapport.

meta:
  version: 1
  accessed: "2026-10-05"
  disclaimer_nl: >-
    Dit is een oriëntatie op rechtsgebieden waar u op moet letten en geen juridisch advies.
    Het geeft geen oordeel over of uw idee is toegestaan.
  known_gaps:
    - "autoriteitpersoonsgegevens.nl, dnb.nl en delen van afm.nl waren niet op te halen (HTTP 403/Access Denied); AP- en DNB-uitspraken komen daardoor uit zoekresultaten of secundaire bronnen."
    - "Rechtspraak (HvJ EU, Hoge Raad, CBb) is niet systematisch onderzocht."
    - "Sectorale regelgeving buiten de vijf gebieden (o.a. Geneesmiddelenwet, medische hulpmiddelen, betaaldiensten PSD2, DSA, Data Act) is alleen zijdelings meegenomen."

areas:
  # ---------------------------------------------------------------------------------------------
  - id: privacy
    name: "Privacy (AVG)"
    summary_nl: >-
      De AVG geldt zodra gegevens over identificeerbare natuurlijke personen worden verwerkt, ook door een
      startup met één klant. Kassadata, locatie, apparaat-ID's en gebruikersaccounts zijn vaak al persoonsgegevens.
    applies_to:
      - text: "Apps, platforms, webshops en dashboards met accounts, klantgegevens of locatiegegevens"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
      - text: "Ideeën die gezondheids-, biometrische of andere bijzondere persoonsgegevens gebruiken"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
      - text: "Websites en apps die cookies of vergelijkbare trackers op het apparaat van de gebruiker plaatsen"
        source_url: "https://wetten.overheid.nl/BWBR0009950/"
      - text: "Geautomatiseerde profilering of besluiten over mensen (bijv. scoring, personalisatie)"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
    laws:
      - id: avg_4
        reference: "AVG art. 4 (definities: persoonsgegevens, verwerking, profilering)"
        article: "4"
        what_nl: "Bepaalt wat een persoonsgegeven is (alle informatie over een geïdentificeerde of identificeerbare persoon, ook via een online identificator of locatiegegevens) en wat verwerking en profilering zijn."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_5_6_7
        reference: "AVG art. 5 (beginselen), art. 6 (rechtmatigheid), art. 7 (toestemming)"
        article: "5, 6, 7"
        what_nl: "Elke verwerking heeft een doel en een grondslag nodig. Toestemming moet aan de voorwaarden van art. 7 voldoen."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_9
        reference: "AVG art. 9 (bijzondere categorieën persoonsgegevens)"
        article: "9"
        what_nl: "Verwerking van gegevens over gezondheid, biometrie voor identificatie, genetische gegevens, ras, religie, seksueel gedrag e.d. is in beginsel verboden, tenzij een uitzondering uit lid 2 geldt (bijv. uitdrukkelijke toestemming)."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_12_14
        reference: "AVG art. 12, 13, 14 (transparantie en informatieplicht)"
        article: "12, 13, 14"
        what_nl: "Betrokkenen moeten (o.a. in een privacyverklaring) worden geïnformeerd over wie verwerkt, waarom, op welke grondslag en hoe lang."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_15_20
        reference: "AVG art. 15 (inzage), art. 17 (wissing), art. 20 (overdraagbaarheid)"
        article: "15, 17, 20"
        what_nl: "Rechten van betrokkenen waar de organisatie procesmatig op moet kunnen reageren."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_22
        reference: "AVG art. 22 (geautomatiseerde individuele besluitvorming, waaronder profilering)"
        article: "22"
        what_nl: "Recht om niet te worden onderworpen aan een uitsluitend geautomatiseerd besluit met rechtsgevolgen of vergelijkbaar aanmerkelijk effect, met uitzonderingen in lid 2."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_25_28_32
        reference: "AVG art. 25 (privacy by design), art. 28 (verwerker), art. 32 (beveiliging)"
        article: "25, 28, 32"
        what_nl: "Privacy inbouwen in het ontwerp, een verwerkersovereenkomst sluiten met leveranciers die namens u persoonsgegevens verwerken (cloud, e-mailtools, analytics), en passende beveiliging."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_30
        reference: "AVG art. 30 (register van verwerkingsactiviteiten), lid 5 (uitzondering <250 personen)"
        article: "30"
        what_nl: "Registerplicht. De uitzondering voor organisaties met minder dan 250 personen vervalt als de verwerking een risico inhoudt, niet incidenteel is of bijzondere categorieën betreft."
        source_url: "https://www.privacy-regulation.eu/nl/artikel-30-register-van-de-verwerkingsactiviteiten-EU-AVG.htm"
        evidence: text_checked
        verified: false
      - id: avg_33_34
        reference: "AVG art. 33 (melding datalek aan toezichthouder binnen 72 uur), art. 34 (mededeling aan betrokkene)"
        article: "33, 34"
        what_nl: "Een datalek moet zonder onredelijke vertraging en indien mogelijk binnen 72 uur worden gemeld, tenzij het niet waarschijnlijk is dat het een risico inhoudt."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_35_37
        reference: "AVG art. 35 (DPIA, lid 3: profilering met rechtsgevolgen, grootschalige bijzondere gegevens, grootschalige monitoring openbare ruimte), art. 37 (functionaris voor gegevensbescherming)"
        article: "35, 37"
        what_nl: "Een DPIA is vereist bij waarschijnlijk hoog risico. De AP heeft daarnaast een eigen lijst (art. 35 lid 4)."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_44
        reference: "AVG art. 44 e.v. (doorgifte naar derde landen)"
        article: "44"
        what_nl: "Doorgifte buiten de EU (bijv. VS-cloud of VS-AI-API) vraagt een doorgiftemechanisme."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: avg_83
        reference: "AVG art. 83 (boetes: tot 10 mln / 2% omzet en tot 20 mln / 4% omzet)"
        article: "83"
        what_nl: "Bovengrenzen van bestuurlijke boetes."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        evidence: text_checked
        verified: false
      - id: tw_11_7a
        reference: "Telecommunicatiewet art. 11.7a (cookies en vergelijkbare technieken)"
        article: "11.7a"
        what_nl: "Opslaan van of toegang krijgen tot informatie op het apparaat van de gebruiker mag alleen met duidelijke informatie en toestemming van de gebruiker. Uit de gelezen wettekst volgen geen uitzonderingen in dit artikel; de uitzonderingen voor functionele en bepaalde analytische cookies staan elders: TODO verify."
        source_url: "https://wetten.overheid.nl/BWBR0009950/"
        evidence: text_checked
        verified: false
      - id: uavg
        reference: "Uitvoeringswet AVG (nationale aanvullingen, o.a. over BSN, bijzondere gegevens en toezicht)"
        article: "TODO verify"
        what_nl: "Nationale aanvullingen op de AVG. Relevante artikelen niet doorgenomen."
        source_url: "https://wetten.overheid.nl/BWBR0040940/"
        evidence: text_checked
        verified: false
      - id: aiact_adjacent
        reference: "AI-verordening (EU) 2024/1689 art. 50 (transparantie: informeren dat iemand met AI praat, markeren van synthetische content)"
        article: "50"
        what_nl: "Valt formeel buiten de vijf gebieden, maar raakt ideeën met chatbots en gegenereerde content. Toepassing volgens de oorspronkelijke tekst vanaf 2 augustus 2026 (art. 113); wijzigingen door de AI-omnibus: zie recent_changes."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32024R1689"
        evidence: text_checked
        verified: false
    trigger_questions:
      - id: privacy_q1
        text: "Worden gegevens verwerkt over identificeerbare personen, zoals klanten, gebruikers, medewerkers, locatie of een account?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"]
      - id: privacy_q2
        text: "Gaat het om gezondheid, biometrie of andere gevoelige gegevens over personen?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"]
      - id: privacy_q3
        text: "Worden mensen geprofileerd of worden er geautomatiseerde beslissingen over hen genomen (bijv. scoring, personalisatie, AI die gebruikersgegevens analyseert)?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"]
      - id: privacy_q4
        text: "Worden cookies, trackers of andere technieken op het apparaat van de gebruiker geplaatst of uitgelezen (website of app)?"
        based_on: ["https://wetten.overheid.nl/BWBR0009950/"]
      - id: privacy_q5
        text: "Worden persoonsgegevens gedeeld met of verwerkt door externe partijen, zoals clouddiensten, AI-API's of kassa- en betaalleveranciers?"
        based_on: ["https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"]
    common_mistakes:
      - text: "Een privacyverklaring van een andere site kopiëren zonder aan te passen aan de eigen verwerkingen en bewaartermijnen."
        source_url: "https://mtsprout.nl/management-leiderschap/de-5-meest-voorkomende-fouten-een-privacyverklaring"
        evidence: secondary
        verified: false
      - text: "Een standaard verwerkersovereenkomst gebruiken die niet past, of de subverwerkers-clausule vergeten (bijv. cloudleverancier die weer een andere partij inschakelt)."
        source_url: "https://ib-p.nl/2025/04/de-5-meest-gemaakte-fouten-in-verwerkersovereenkomsten/"
        evidence: secondary
        verified: false
      - text: "Cookiebanner met voorgeselecteerde vakjes of met 'door deze site te gebruiken ga je akkoord'; dat is geen geldige toestemming."
        source_url: "https://www.frankwatching.com/archive/2019/12/12/cookiebanners-meestgemaakte-fouten/"
        evidence: secondary
        verified: false
      - text: "Denken dat het verwerkingsregister niet nodig is omdat er minder dan 250 mensen werken. Volgens zoekresultaten over AP-uitleg verwerken organisaties met personeel al niet-incidenteel. TODO verify bij AP-bron (pagina was niet op te halen)."
        source_url: "https://www.privacy-regulation.eu/nl/artikel-30-register-van-de-verwerkingsactiviteiten-EU-AVG.htm"
        evidence: search_snippet
        verified: false
    recent_changes:
      - date: "2026-07-27"
        text: "AI-omnibus in werking getreden. Hoog-risico AI-systemen (Annex III) pas vanaf 2 december 2027, in producten (Annex I) vanaf 2 augustus 2028. De Commissie vermeldt ook de publicatie OJ:L_202601744."
        source_url: "https://digital-strategy.ec.europa.eu/en/news/ai-omnibus-enters-force"
        evidence: primary_page
        verified: false
      - date: "2026-08-02"
        text: "AI-verordening in beginsel van toepassing, inclusief transparantieplicht art. 50 (oorspronkelijke tekst art. 113). Of de omnibus voor art. 50 afwijkende data geeft, is niet in een primaire bron nagelezen: TODO verify."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32024R1689"
        evidence: text_checked
        verified: false
      - date: "2025-09-12"
        text: "Data Act van toepassing: gebruikers van verbonden apparaten krijgen meer controle over gegevens. Artikelnummers niet nagelezen: TODO verify."
        source_url: "https://www.digitaleoverheid.nl/nieuws/europese-data-act-van-toepassing-geworden/"
        evidence: primary_page
        verified: false
      - date: "2026 (nog in onderhandeling)"
        text: "Data-omnibus (voorstellen tot wijziging van AVG en ePrivacy, o.a. definitie persoonsgegevens) is volgens zoekresultaten nog niet vastgesteld; definitieve vaststelling niet vóór eind 2026 verwacht. Council-compromis zou de nieuwe definitie schrappen. Alleen secundaire bronnen: TODO verify."
        source_url: "https://iapp.org/news/a/eu-member-states-leaked-digital-omnibus-compromise-proposal-eliminates-revised-gdpr-definition-of-personal-data"
        evidence: secondary
        verified: false
    sources:
      - url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32016R0679"
        title: "AVG (Verordening (EU) 2016/679), volledige tekst"
        type: primary
        accessed: "2026-10-05"
      - url: "https://wetten.overheid.nl/BWBR0009950/"
        title: "Telecommunicatiewet"
        type: primary
        accessed: "2026-10-05"
      - url: "https://wetten.overheid.nl/BWBR0040940/"
        title: "Uitvoeringswet AVG"
        type: primary
        accessed: "2026-10-05"
      - url: "https://digital-strategy.ec.europa.eu/en/news/ai-omnibus-enters-force"
        title: "Europese Commissie: AI Omnibus enters into force"
        type: primary
        accessed: "2026-10-05"
      - url: "https://www.digitaleoverheid.nl/nieuws/europese-data-act-van-toepassing-geworden/"
        title: "Digitale Overheid: Europese Data Act van toepassing geworden"
        type: primary
        accessed: "2026-10-05"
      - url: "https://www.privacy-regulation.eu/nl/artikel-30-register-van-de-verwerkingsactiviteiten-EU-AVG.htm"
        title: "AVG art. 30 (tekst via privacy-regulation.eu)"
        type: secondary
        accessed: "2026-10-05"
    source_conflicts:
      - "Zoekresultaten noemen verschillende data voor AI-omnibus (Raadsgoedkeuring 29 juni 2026 volgens een blog; inwerkingtreding 27 juli 2026 volgens de Commissie). Hier is de Commissiepagina aangehouden."

  # ---------------------------------------------------------------------------------------------
  - id: consumentenrecht
    name: "Consumentenrecht en oneerlijke handelspraktijken"
    summary_nl: >-
      Wie producten of diensten aan consumenten (B2C) aanbiedt valt onder informatieplichten, herroepingsrecht,
      conformiteit en het verbod op misleidende of agressieve handelspraktijken. De ACM handhaaft.
    applies_to:
      - text: "Webshops en andere verkoop op afstand aan consumenten (ook tweedehands, als de verkoper handelaar is)"
        source_url: "https://wetten.overheid.nl/BWBR0005289/"
      - text: "Apps en abonnementsdiensten voor consumenten"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32011L0083"
      - text: "Elke commerciële communicatie richting consumenten: reclame, reviews, influencers, kortingen, 'groene' claims"
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32005L0029"
    laws:
      - id: bw6_193a_j
        reference: "BW Boek 6 art. 193a t/m 193j (oneerlijke handelspraktijken; o.a. 193c misleidende handelingen, 193d misleidende omissies, 193g zwarte lijst misleidend, 193h agressief, 193i zwarte lijst agressief)"
        article: "6:193a-193j"
        what_nl: "Nederlandse implementatie van de Richtlijn oneerlijke handelspraktijken. Handelspraktijken zijn misleidend of agressief als zij de gemiddelde consument kunnen misleiden of de keuzevrijheid beperken."
        source_url: "https://wetten.overheid.nl/BWBR0005289/"
        evidence: text_checked
        verified: false
      - id: ucpd
        reference: "Richtlijn 2005/29/EG art. 5-9 (oneerlijke handelspraktijken, misleidende handelingen/omissies, agressieve praktijken)"
        article: "5, 6, 7, 8, 9"
        what_nl: "Europese bron van de Nederlandse regels."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32005L0029"
        evidence: text_checked
        verified: false
      - id: bw6_230g_v
        reference: "BW Boek 6 art. 230g e.v. (overeenkomsten op afstand en buiten verkoopruimte; o.a. 230m informatieplicht vóór de koop, 230o ontbinding binnen 14 dagen, 230p uitzonderingen, 230v vorm van de informatie)"
        article: "6:230g, 230m, 230o, 230p, 230v"
        what_nl: "Informatie voor de koop (o.a. over het herroepingsrecht) en 14 dagen ontbindingsrecht, met uitzonderingen."
        source_url: "https://wetten.overheid.nl/BWBR0005289/"
        evidence: text_checked
        verified: false
      - id: bw6_230oa
        reference: "BW Boek 6 art. 230oa (herroepingsfunctie op de online-interface)"
        article: "6:230oa"
        what_nl: "Handelaar moet ontbinding van online gesloten overeenkomsten mogelijk maken via een duidelijk zichtbare, gemakkelijk toegankelijke functie."
        source_url: "https://wetten.overheid.nl/BWBR0005289/"
        evidence: text_checked
        verified: false
      - id: crd
        reference: "Richtlijn 2011/83/EU art. 6 (informatie), art. 9 (herroepingsrecht), art. 11 bis (herroepingsfunctie, ingevoegd door Richtlijn (EU) 2023/2673)"
        article: "6, 9, 11 bis"
        what_nl: "Europese bron voor informatieplicht, herroepingsrecht en herroepingsknop."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32011L0083"
        evidence: text_checked
        verified: false
      - id: bw7_17_18
        reference: "BW Boek 7 art. 17 (conformiteit) en art. 18 (consumentenkoop: wanneer beantwoordt een zaak aan de overeenkomst)"
        article: "7:17, 7:18"
        what_nl: "Verkochte zaken moeten aan de overeenkomst beantwoorden. Bewijslast en termijnen: TODO verify (artikelen waarin de bewijsregels staan niet doorgenomen)."
        source_url: "https://wetten.overheid.nl/BWBR0005290/"
        evidence: text_checked
        verified: false
      - id: whc_fines
        reference: "Wet handhaving consumentenbescherming art. 2.15 (bestuurlijke boete) en art. 8.8 (verbod oneerlijke handelspraktijken)"
        article: "2.15, 8.8"
        what_nl: "Boete maximaal 900.000 euro of 1% omzet; voor oneerlijke handelspraktijken als bedoeld in BW 6:193g of 193i maximaal 900.000 euro of 10% omzet (volgens de gelezen wettekst)."
        source_url: "https://wetten.overheid.nl/BWBR0020586/"
        evidence: text_checked
        verified: false
      - id: price_ref
        reference: "Besluit prijsaanduiding producten art. 5a (referentieprijs bij kortingen: laagste prijs van de afgelopen 30 dagen)"
        article: "TODO verify"
        what_nl: "Alleen gezien in secondaire bronnen; wettekst van het Besluit niet gelezen."
        source_url: "https://www.inretail.nl/kennisbank/consument/nieuwe-wetgeving/regels-aanduiding-referentieprijs/"
        evidence: secondary
        verified: false
      - id: ecgt
        reference: "Richtlijn (EU) 2024/825 (groene transitie): wijzigt Richtlijn 2005/29/EG en 2011/83/EU; omzetting uiterlijk 27 maart 2026, toepassing vanaf 27 september 2026 (art. 4 van de richtlijn)"
        article: "TODO verify (artikelen over milieuclaims)"
        what_nl: "Strengere regels voor algemene milieuclaims en duurzaamheidslabels."
        source_url: "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32024L0825"
        evidence: text_checked
        verified: false
    trigger_questions:
      - id: consumenten_q1
        text: "Verkoopt of levert het idee producten, diensten of digitale inhoud aan consumenten (particulieren), online of op afstand?"
        based_on: ["https://wetten.overheid.nl/BWBR0005289/", "https://eur-lex.europa.eu/legal-content/NL/TXT/HTML/?uri=CELEX:32011L0083"]
      - id: consumenten_q2
        text: "Wordt er geadverteerd of gecommuniceerd richting consumenten met beloftes, kortingen, reviews, influencers of 'duurzaam'- of 'gezond'-claims?"
        based_on: ["https://wetten.overheid.nl/BWBR0005289/", "https://www.acm.nl/nl/publicaties/acm-strengere-regels-voor-online-verkopers"]
      - id: consumenten_q3
        text: "Gaat het om een abonnement, automatische verlenging of proefperiode?"
        based_on: ["https://wetten.overheid.nl/BWBR0005289/"]
      - id: consumenten_q4
        text: "Worden tweedehands of gebruikte producten door een bedrijf (niet incidenteel door een particulier) aan consumenten verkocht?"
        based_on: ["https://wetten.overheid.nl/BWBR0005290/"]
    common_mistakes:
      - text: "Het herroepingsrecht niet (juist) vermelden of de herroepingsfunctie niet aanbieden; ACM kan boetes opleggen en de bedenktermijn kan verlengd worden."
        source_url: "https://louwersadvocaten.nl/herroepingsrecht-een-valkuil-voor-veel-webshops/"
        evidence: secondary
        verified: false
      - text: "Nepreviews of onduidelijke omgang met reviews; valse beoordelingen, likes, views of volgers zijn onder alle omstandigheden verboden."
        source_url: "https://www.acm.nl/nl/publicaties/acm-strengere-regels-voor-online-verkopers"
        evidence: primary_page
        verified: false
